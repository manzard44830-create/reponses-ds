name: Garder le dépôt actif

# GitHub désactive les tâches planifiées d'un dépôt public sans activité pendant 60 jours.
# Ce petit workflow enregistre une date une fois par mois pour éviter cette mise en pause.

on:
  schedule:
    - cron: "0 4 1 * *"   # le 1er de chaque mois à 4 h (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garder-actif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enregistrer la date du jour
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > derniere_activite.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derniere_activite.txt
          git commit -m "Activité mensuelle automatique" || echo "Rien à enregistrer"
          git push
