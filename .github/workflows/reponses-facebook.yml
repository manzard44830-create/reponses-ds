name: Réponses automatiques Facebook

# Objectif : chaque commentaire reçoit sa réponse entre 2 h et 3 h après sa publication.
#
# Chaque exécution « boucle » reste allumée environ 5 h 30 et relance le programme toutes les
# INTERVALLE_MINUTES (15 par défaut). À la fin, elle démarre ELLE-MÊME la boucle suivante :
# la chaîne ne dépend plus des lancements planifiés de GitHub, qui sont souvent sautés.
# Le lancement horaire ne sert plus que de filet de sécurité, si la chaîne s'arrêtait.
# Pendant qu'une boucle tourne, les lancements en surplus attendent ou sont annulés : c'est normal.
#
# Démarrer : Actions > Run workflow > « boucle ». Arrêter : variable MODE_TEST à 1
# (puis « Cancel workflow » sur la boucle en cours pour un arrêt immédiat).

on:
  schedule:
    - cron: "7 * * * *"      # filet de sécurité : relance la chaîne si elle s'est arrêtée
  workflow_dispatch:
    inputs:
      lancement:
        description: "test = un passage sans rien publier · boucle = démarre les réponses automatiques (MODE_TEST doit valoir 0)"
        type: choice
        options:
          - test
          - boucle
        default: test

concurrency:
  group: reponses-facebook
  cancel-in-progress: false

jobs:
  repondre:
    # Les boucles ne tournent que si MODE_TEST vaut 0. Les tests manuels tournent toujours (sans rien publier).
    if: (github.event_name == 'workflow_dispatch' && inputs.lancement != 'boucle') || vars.MODE_TEST == '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write        # pour démarrer la boucle suivante
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la mémoire des commentaires traités
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Répondre aux commentaires
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Renseigne UNE SEULE de ces clés dans les secrets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IA_API_KEY: ${{ secrets.IA_API_KEY }}
          IA_BASE_URL: ${{ vars.IA_BASE_URL }}
          FOURNISSEUR_IA: ${{ vars.FOURNISSEUR_IA }}
          # Test manuel : rien n'est publié. Boucle : variable MODE_TEST du dépôt.
          MODE_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.lancement != 'boucle') && '1' || vars.MODE_TEST || '1' }}
          MODELE_IA: ${{ vars.MODELE_IA }}
          MAX_REPONSES_PAR_EXECUTION: ${{ vars.MAX_REPONSES_PAR_EXECUTION }}
          AGE_MAX_VIDEO_JOURS: ${{ vars.AGE_MAX_VIDEO_JOURS }}
          AGE_MAX_COMMENTAIRE_HEURES: ${{ vars.AGE_MAX_COMMENTAIRE_HEURES }}
          LIKER_COMMENTAIRES: ${{ vars.LIKER_COMMENTAIRES }}
          VIDEOS_SEULEMENT: ${{ vars.VIDEOS_SEULEMENT }}
          PAUSE_ENTRE_APPELS_IA: ${{ vars.PAUSE_ENTRE_APPELS_IA }}
          PAUSE_PUBLICATION_MIN: ${{ vars.PAUSE_PUBLICATION_MIN }}
          PAUSE_PUBLICATION_MAX: ${{ vars.PAUSE_PUBLICATION_MAX }}
          DELAI_MIN_COMMENTAIRE_MINUTES: ${{ vars.DELAI_MIN_COMMENTAIRE_MINUTES }}
          DELAI_MAX_COMMENTAIRE_MINUTES: ${{ vars.DELAI_MAX_COMMENTAIRE_MINUTES }}
          INTERVALLE_MINUTES: ${{ vars.INTERVALLE_MINUTES }}
          BOUCLE: ${{ (github.event_name == 'schedule' || inputs.lancement == 'boucle') && '1' || '0' }}
        run: |
          set -u
          INTERVALLE=$(( ${INTERVALLE_MINUTES:-15} * 60 ))   # temps entre deux passages
          DUREE_BOUCLE=19800                                  # 5 h 30 de boucle (limite GitHub : 6 h)

          if [ "$BOUCLE" != "1" ]; then
            echo "Test manuel : un seul passage, rien n'est publié."
            python3 reponse_auto.py
            exit $?
          fi

          FIN=$(( $(date +%s) + DUREE_BOUCLE ))
          PASSAGE=0
          while true; do
            PASSAGE=$(( PASSAGE + 1 ))
            DEBUT=$(date +%s)
            echo "::group::Passage $PASSAGE — $(date -u '+%H:%M:%S UTC')"
            python3 reponse_auto.py || echo "⚠️ Passage $PASSAGE en erreur, la boucle continue."
            echo "::endgroup::"
            if [ $(date +%s) -ge $FIN ]; then
              echo "Fin de la boucle après $PASSAGE passage(s). La suivante prend le relais."
              break
            fi
            RESTE=$(( INTERVALLE - ( $(date +%s) - DEBUT ) ))
            [ $RESTE -gt 0 ] && sleep $RESTE
          done

      - name: Sauvegarder la mémoire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}

      - name: Démarrer la boucle suivante
        if: success() && vars.MODE_TEST == '0' && (github.event_name == 'schedule' || inputs.lancement == 'boucle')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reponses-facebook.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f lancement=boucle
          echo "Boucle suivante demandée : elle démarre dès que celle-ci est terminée."
