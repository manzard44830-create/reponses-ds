name: Réponses automatiques Facebook

# Objectif : chaque commentaire reçoit sa réponse entre 2 h et 3 h après sa publication.
#
# GitHub saute souvent les lancements planifiés : on ne compte donc pas sur eux pour le rythme.
# Chaque exécution reste allumée environ 5 h 30 et relance elle-même le programme
# toutes les INTERVALLE_MINUTES (15 par défaut). Un lancement est demandé toutes les heures :
# pendant qu'une boucle tourne, le suivant attend son tour (concurrency) et prend le relais
# dès qu'elle se termine. Les lancements en surplus sont annulés automatiquement : c'est normal.

on:
  schedule:
    - cron: "7 * * * *"      # toutes les heures (les boucles se relaient)
  workflow_dispatch:         # bouton « Run workflow » : fait UN seul passage, tout de suite
    inputs:
      mode_test:
        description: "Mode test (1 = affiche les réponses sans rien publier)"
        default: "1"

concurrency:
  group: reponses-facebook
  cancel-in-progress: false

jobs:
  repondre:
    # Les boucles automatiques ne tournent que si MODE_TEST vaut 0.
    # Tant que MODE_TEST n'est pas à 0, seuls les tests lancés à la main fonctionnent.
    if: github.event_name != 'schedule' || vars.MODE_TEST == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la mémoire des commentaires traités
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Répondre aux commentaires
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # Renseigne UNE SEULE de ces clés dans les secrets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IA_API_KEY: ${{ secrets.IA_API_KEY }}
          IA_BASE_URL: ${{ vars.IA_BASE_URL }}
          FOURNISSEUR_IA: ${{ vars.FOURNISSEUR_IA }}
          # Lancement manuel : valeur saisie. Boucle planifiée : variable MODE_TEST du dépôt.
          # Sécurité : tant que la variable MODE_TEST=0 n'est pas créée, RIEN n'est publié.
          MODE_TEST: ${{ github.event.inputs.mode_test || vars.MODE_TEST || '1' }}
          MODELE_IA: ${{ vars.MODELE_IA }}
          MAX_REPONSES_PAR_EXECUTION: ${{ vars.MAX_REPONSES_PAR_EXECUTION }}
          AGE_MAX_VIDEO_JOURS: ${{ vars.AGE_MAX_VIDEO_JOURS }}
          AGE_MAX_COMMENTAIRE_HEURES: ${{ vars.AGE_MAX_COMMENTAIRE_HEURES }}
          LIKER_COMMENTAIRES: ${{ vars.LIKER_COMMENTAIRES }}
          VIDEOS_SEULEMENT: ${{ vars.VIDEOS_SEULEMENT }}
          PAUSE_ENTRE_APPELS_IA: ${{ vars.PAUSE_ENTRE_APPELS_IA }}
          PAUSE_PUBLICATION_MIN: ${{ vars.PAUSE_PUBLICATION_MIN }}
          PAUSE_PUBLICATION_MAX: ${{ vars.PAUSE_PUBLICATION_MAX }}
          DELAI_MIN_COMMENTAIRE_MINUTES: ${{ vars.DELAI_MIN_COMMENTAIRE_MINUTES }}
          DELAI_MAX_COMMENTAIRE_MINUTES: ${{ vars.DELAI_MAX_COMMENTAIRE_MINUTES }}
          INTERVALLE_MINUTES: ${{ vars.INTERVALLE_MINUTES }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -u
          INTERVALLE=$(( ${INTERVALLE_MINUTES:-15} * 60 ))   # temps entre deux passages
          DUREE_BOUCLE=19800                                  # 5 h 30 de boucle (limite GitHub : 6 h)

          if [ "$EVENEMENT" != "schedule" ]; then
            echo "Lancement manuel : un seul passage."
            python3 reponse_auto.py
            exit $?
          fi

          FIN=$(( $(date +%s) + DUREE_BOUCLE ))
          PASSAGE=0
          while true; do
            PASSAGE=$(( PASSAGE + 1 ))
            DEBUT=$(date +%s)
            echo "::group::Passage $PASSAGE — $(date -u '+%H:%M:%S UTC')"
            python3 reponse_auto.py || echo "⚠️ Passage $PASSAGE en erreur, la boucle continue."
            echo "::endgroup::"
            if [ $(date +%s) -ge $FIN ]; then
              echo "Fin de la boucle après $PASSAGE passage(s). La suivante prend le relais."
              break
            fi
            RESTE=$(( INTERVALLE - ( $(date +%s) - DEBUT ) ))
            [ $RESTE -gt 0 ] && sleep $RESTE
          done

      - name: Sauvegarder la mémoire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
